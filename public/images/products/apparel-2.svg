<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" width="600" height="420">
  <defs>
    <radialGradient id="appGlow-KINETIC TEE" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad-KINETIC TEE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="360" rx="200" ry="35" fill="url(#appGlow-KINETIC TEE)" />
  <ellipse cx="300" cy="365" rx="160" ry="18" fill="#000000" opacity="0.7" filter="blur(8px)" />

  <text x="300" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="70" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" letter-spacing="6" text-anchor="middle" text-transform="uppercase">KINETIC TEE</text>

  <!-- Apparel Silhouette: Hoodie or Tee or Shorts -->
  <g transform="translate(140, 50)">
    
      <!-- Athletic Tee Body -->
      <path d="M 90 70 L 130 45 C 145 55, 175 55, 190 45 L 230 70 L 280 110 L 250 145 L 220 125 L 220 290 C 220 295, 100 295, 100 290 L 100 125 L 70 145 L 40 110 Z" fill="url(#bodyGrad-KINETIC TEE)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
      <!-- Crew Neck Trim -->
      <path d="M 130 45 C 145 60, 175 60, 190 45" stroke="#00E5FF" stroke-width="3" fill="none" />
      <!-- Breathable Ventilation Mesh Lines -->
      <line x1="110" y1="140" x2="110" y2="270" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
      <line x1="210" y1="140" x2="210" y2="270" stroke="#00E5FF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
      <!-- STRIDE Logo Center Chest -->
      <path d="M 150 100 L 160 85 H 167 L 157 100 Z" fill="#00E5FF" />
      <path d="M 162 100 L 172 85 H 179 L 169 100 Z" fill="#FFFFFF" />
    
  </g>

  <!-- Spec Tag -->
  <g transform="translate(480, 50)">
    <rect width="80" height="24" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.15)" />
    <circle cx="14" cy="12" r="4" fill="#00E5FF" />
    <text x="24" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="1">STRIDE</text>
  </g>
</svg>