<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" width="600" height="420">
  <defs>
    <radialGradient id="glow-s5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="foam-s5" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <linearGradient id="plate-s5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="upper-s5" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow-s5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00E5FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Underglow -->
  <ellipse cx="300" cy="330" rx="220" ry="40" fill="url(#glow-s5)" />
  <!-- Dark Ground Contact Shadow -->
  <ellipse cx="300" cy="335" rx="190" ry="22" fill="#000000" opacity="0.75" filter="blur(10px)" />

  <!-- Ghost Watermark in Background -->
  <text x="300" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="78" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" letter-spacing="8" text-anchor="middle" text-transform="uppercase">TURBO</text>

  <!-- Shoe Silhouette Group with dynamic rotation -->
  <g transform="translate(40, 20) rotate(-4 260 200)" filter="url(#shadow-s5)">
    <!-- Midsole Base -->
    <path d="M 80 280 C 130 295, 220 305, 300 290 C 370 275, 430 250, 470 230 C 475 235, 480 245, 470 260 C 420 295, 330 320, 240 315 C 160 310, 95 295, 80 280 Z" fill="url(#foam-s5)" />
    
    <!-- Outsole Rubber Tread -->
    <path d="M 85 285 C 135 300, 225 310, 305 295 C 375 280, 435 255, 468 238 L 472 250 C 425 288, 335 315, 245 312 C 165 308, 100 292, 85 285 Z" fill="#0F172A" />
    <!-- Lug Grips -->
    <line x1="140" y1="298" x2="160" y2="304" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="305" x2="200" y2="308" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <line x1="220" y1="309" x2="240" y2="310" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <line x1="260" y1="308" x2="280" y2="306" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <line x1="320" y1="298" x2="340" y2="292" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <line x1="360" y1="288" x2="380" y2="280" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />

    <!-- Carbon Fiber Propulsion Plate Core -->
    <path d="M 120 285 C 180 292, 280 288, 360 265 C 400 252, 440 238, 460 230" stroke="url(#plate-s5)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Upper Body Mesh -->
    <path d="M 90 275 C 95 220, 130 180, 180 160 C 220 145, 260 140, 290 170 C 330 195, 380 215, 430 220 C 460 222, 475 228, 470 232 C 430 250, 370 275, 300 290 C 220 305, 130 295, 90 275 Z" fill="url(#upper-s5)" />

    <!-- Aeroweave Mesh Overlay Texture -->
    <path d="M 140 240 Q 200 220 260 230 T 360 220" stroke="rgba(255,255,255,0.12)" stroke-width="2" fill="none" />
    <path d="M 150 220 Q 210 200 270 210 T 370 200" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none" />
    <path d="M 160 200 Q 220 180 280 190 T 380 180" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" fill="none" />

    <!-- Ankle Collar & Tongue -->
    <path d="M 175 162 C 165 140, 180 120, 205 125 C 220 128, 230 140, 240 155 C 248 165, 255 170, 265 172" fill="#0B131E" stroke="#8EF03A" stroke-width="2" />
    <path d="M 205 125 C 225 105, 245 110, 255 135 L 260 155" fill="#00E5FF" opacity="0.85" />

    <!-- Lacing System -->
    <path d="M 230 150 L 255 180" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <path d="M 250 160 L 275 190" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 270 170 L 295 200" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    <path d="M 290 180 L 315 210" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 310 190 L 335 220" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />

    <!-- STRIDE Signature Kinetic Chevron Logo on Lateral Quarter -->
    <g transform="translate(230, 200) rotate(-14) scale(0.9)">
      <path d="M 10 32 L 28 6 H 38 L 20 32 H 10 Z" fill="#00E5FF" opacity="0.95" />
      <path d="M 29 32 L 47 6 H 57 L 39 32 H 29 Z" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Heel Stabilizer Clip -->
    <path d="M 85 270 C 80 230, 100 200, 130 195 C 135 215, 120 250, 115 270 Z" fill="#00E5FF" opacity="0.8" />
  </g>

  <!-- Spec Tag Badge in Corner -->
  <g transform="translate(480, 50)">
    <rect width="80" height="24" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.15)" />
    <circle cx="14" cy="12" r="4" fill="#00E5FF" />
    <text x="24" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="1">STRIDE</text>
  </g>
</svg>