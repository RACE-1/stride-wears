<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" width="600" height="420">
  <defs>
    <radialGradient id="gearGlow-CREW SOCKS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gearGrad-CREW SOCKS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="355" rx="190" ry="32" fill="url(#gearGlow-CREW SOCKS)" />
  <ellipse cx="300" cy="360" rx="150" ry="16" fill="#000000" opacity="0.75" filter="blur(8px)" />

  <text x="300" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" letter-spacing="6" text-anchor="middle" text-transform="uppercase">CREW SOCKS</text>

  <g transform="translate(180, 60)">
    
      <!-- High Performance Crew Socks Pair -->
      <path d="M 60 40 L 95 40 L 95 190 C 95 210, 140 230, 160 215 C 175 205, 170 180, 135 170 L 95 160 L 60 160 Z" fill="url(#gearGrad-CREW SOCKS)" stroke="#00E5FF" stroke-width="2" />
      <!-- Ribbed Compression Cuff -->
      <rect x="60" y="40" width="35" height="30" fill="#0F172A" />
      <line x1="60" y1="48" x2="95" y2="48" stroke="#00E5FF" stroke-width="2" />
      <line x1="60" y1="58" x2="95" y2="58" stroke="#FFFFFF" stroke-width="2" />
      <!-- Pair 2 Shadowed Behind -->
      <path d="M 130 50 L 165 50 L 165 200 C 165 220, 210 240, 230 225 C 245 215, 240 190, 205 180 L 165 170 L 130 170 Z" fill="url(#gearGrad-CREW SOCKS)" stroke="rgba(255,255,255,0.2)" stroke-width="2" opacity="0.85" />
      <rect x="130" y="50" width="35" height="30" fill="#0F172A" />
      <!-- STRIDE Emblem -->
      <path d="M 70 100 L 78 88 H 84 L 76 100 Z" fill="#00E5FF" />
      <path d="M 80 100 L 88 88 H 94 L 86 100 Z" fill="#FFFFFF" />
    
  </g>

  <g transform="translate(480, 50)">
    <rect width="80" height="24" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.15)" />
    <circle cx="14" cy="12" r="4" fill="#00E5FF" />
    <text x="24" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="1">STRIDE</text>
  </g>
</svg>