<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" width="600" height="420">
  <defs>
    <radialGradient id="gearGlow-UTILITY PACK" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8EF03A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8EF03A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gearGrad-UTILITY PACK" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="355" rx="190" ry="32" fill="url(#gearGlow-UTILITY PACK)" />
  <ellipse cx="300" cy="360" rx="150" ry="16" fill="#000000" opacity="0.75" filter="blur(8px)" />

  <text x="300" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" letter-spacing="6" text-anchor="middle" text-transform="uppercase">UTILITY PACK</text>

  <g transform="translate(180, 60)">
    
      <!-- CrossBody Sling Bag -->
      <rect x="30" y="90" width="180" height="130" rx="30" fill="url(#gearGrad-UTILITY PACK)" stroke="#8EF03A" stroke-width="2" />
      <!-- Tactical Crossbody Strap -->
      <path d="M 0 50 L 50 90 L 190 220 L 240 260" stroke="#0B131E" stroke-width="16" stroke-linecap="round" fill="none" />
      <path d="M 0 50 L 50 90 L 190 220 L 240 260" stroke="#8EF03A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />
      <!-- Quick Release Buckle -->
      <rect x="90" y="130" width="60" height="30" rx="8" fill="#020617" stroke="#FFFFFF" stroke-width="2" />
      <!-- STRIDE Logo -->
      <path d="M 105 115 L 113 105 H 119 L 111 115 Z" fill="#8EF03A" />
      <path d="M 115 115 L 123 105 H 129 L 121 115 Z" fill="#FFFFFF" />
    
  </g>

  <g transform="translate(480, 50)">
    <rect width="80" height="24" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.15)" />
    <circle cx="14" cy="12" r="4" fill="#8EF03A" />
    <text x="24" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="1">STRIDE</text>
  </g>
</svg>