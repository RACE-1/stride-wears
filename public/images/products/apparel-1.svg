<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" width="600" height="420">
  <defs>
    <radialGradient id="appGlow-TECH FLEECE" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bodyGrad-TECH FLEECE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#11191C" />
    </linearGradient>
  </defs>

  <ellipse cx="300" cy="360" rx="200" ry="35" fill="url(#appGlow-TECH FLEECE)" />
  <ellipse cx="300" cy="365" rx="160" ry="18" fill="#000000" opacity="0.7" filter="blur(8px)" />

  <text x="300" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="70" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" letter-spacing="6" text-anchor="middle" text-transform="uppercase">TECH FLEECE</text>

  <!-- Apparel Silhouette: Hoodie or Tee or Shorts -->
  <g transform="translate(140, 50)">
    
      <!-- Hoodie Body -->
      <path d="M 80 80 L 120 40 C 140 30, 180 30, 200 40 L 240 80 L 290 120 L 260 160 L 230 140 L 230 290 C 230 300, 90 300, 90 290 L 90 140 L 60 160 L 30 120 Z" fill="url(#bodyGrad-TECH FLEECE)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
      <!-- Scuba Hood -->
      <path d="M 120 40 C 120 0, 200 0, 200 40 C 180 60, 140 60, 120 40 Z" fill="#0F172A" stroke="#00E5FF" stroke-width="1.5" />
      <!-- Zipper -->
      <line x1="160" y1="55" x2="160" y2="180" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
      <!-- Kangaroo Pocket -->
      <path d="M 120 220 L 200 220 L 210 270 L 110 270 Z" fill="#0B131E" stroke="rgba(255,255,255,0.08)" />
      <!-- STRIDE Logo on Chest -->
      <path d="M 185 100 L 195 85 H 202 L 192 100 Z" fill="#00E5FF" />
      <path d="M 197 100 L 207 85 H 214 L 204 100 Z" fill="#FFFFFF" />
    
  </g>

  <!-- Spec Tag -->
  <g transform="translate(480, 50)">
    <rect width="80" height="24" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.15)" />
    <circle cx="14" cy="12" r="4" fill="#00E5FF" />
    <text x="24" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="1">STRIDE</text>
  </g>
</svg>