      <!-- STRIDE Branding -->
      <path d="M 105 160 L 115 145 H 122 L 112 160 Z" fill="#00E5FF" />
      <path d="M 117 160 L 127 145 H 134 L 124 160 Z" fill="#FFFFFF" />
