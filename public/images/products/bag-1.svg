  </defs>

  <ellipse cx="300" cy="355" rx="190" ry="32" fill="url(#gearGlow-35L DUFFEL)" />
  <ellipse cx="300" cy="360" rx="150" ry="16" fill="#000000" opacity="0.75" filter="blur(8px)" />

